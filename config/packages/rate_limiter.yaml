framework:
    rate_limiter:
        # Submissions of a checklist outside the admin (spam protection), per visitor (IP address or user) per checklist
        checklist_submission:
            policy: sliding_window
            limit: 5
            interval: '10 minutes'
            cache_pool: cache.rate_limiter

        # Registrations per IP address (spam protection; each one mails the site's owner)
        registration:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
            cache_pool: cache.rate_limiter

        # Forms that send a mail to an address the visitor types in (password reset, new confirmation link),
        # per IP address, so the site can't be used to flood someone's mailbox
        account_mail:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
            cache_pool: cache.rate_limiter

        # Contact form messages per IP address
        contact_form:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
            cache_pool: cache.rate_limiter

    cache:
        pools:
            cache.rate_limiter:
                adapter: cache.app
